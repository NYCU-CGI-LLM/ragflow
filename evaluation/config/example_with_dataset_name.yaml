# Example config using dataset_name instead of dataset_id
# This is useful when you want to use a friendly name rather than UUID

retrieval:
  api_key: "ragflow-YOUR_API_KEY_HERE"
  
  # Use dataset name instead of ID
  dataset_name: "My Knowledge Base"
  
  k: 5
  dynamic_rerank_limit: true
  metrics:
    - recall
    - precision
    - f1
  k_values:
    - 1
    - 3
    - 5

dataset:
  path: "./dataset/example_dataset.json"
  limit: null

output:
  results_path: "results/evaluation_results.json"
